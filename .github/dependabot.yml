# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
#
# Version updates target `dev`, where work lands (`main` takes only PRs from `dev`). They wait
# three days after a release (`cooldown`), a buffer against hijacked releases; security updates
# (a repository setting, not this file) never wait and always target the default branch, `main`.
#
# What Dependabot can't update (devenv/flake locks, the Bun pins, transitive dependencies and
# overrides, the Expo SDK's packages, the core pin) is refreshed weekly by `deps-refresh.yml`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
    # Moved by deps-refresh.yml instead: the core pin (one exact version across the manifests,
    # CI's server image and devenv) and the packages whose versions the Expo SDK decides (its
    # bundledNativeModules.json, applied by `expo install --fix`; a new SDK is a migration).
    ignore:
      - dependency-name: "@atlastodo/*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "@react-native-async-storage/async-storage"
