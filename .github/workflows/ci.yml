# Lint, typecheck and test for every push to dev and main and every PR, a release, or on demand. A push or PR
# only runs the jobs whose files changed (see `changes`); the audit runs when dependencies change
# and once a week.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole suite before it builds a release.
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "26"

jobs:
  # Decides which jobs run. A manual run or a new branch's first push runs everything; the weekly
  # schedule runs only the audit.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      rust: ${{ steps.filter.outputs.rust }}
      core: ${{ steps.filter.outputs.core }}
      app: ${{ steps.filter.outputs.app }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set_all() { for k in lint rust core app deps; do echo "$k=$1" >>"$GITHUB_OUTPUT"; done; }
          case "$EVENT" in
            schedule)
              set_all false
              echo "deps=true" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              if [[ "$BEFORE" =~ ^0*$ ]]; then set_all true; exit 0; fi
              files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')"
              ;;
            pull_request)
              files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
              ;;
            *)
              set_all true
              exit 0
              ;;
          esac
          # The compare API lists at most 300 files; past that, assume everything changed.
          if [ "$(grep -c . <<<"$files")" -ge 300 ]; then set_all true; exit 0; fi
          ci='^(\.github/workflows/ci\.yml|\.bun-version)$'
          shared="^(package\.json$|bun\.lock$|bunfig\.toml$)|$ci"
          rust="^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|deny\.toml$|test-vectors/)|$ci"
          deps="^(bun\.lock|package\.json|apps/[^/]+/package\.json|packages/[^/]+/package\.json|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|deny\.toml)$|$ci"
          has() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          {
            # Prettier checks Markdown, YAML and JSON too, so every change lints.
            echo "lint=$(has .)"
            echo "rust=$(has "$rust")"
            echo "core=$(has "$shared|^packages/|^test-vectors/")"
            echo "app=$(has "$shared|^apps/journal/|^packages/")"
            echo "deps=$(has "$deps")"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Every workspace that defines `typecheck`: the app and journal-core.
      - run: bun run --parallel --filter '*' typecheck
      # The licences of the JS packages the web build bundles, against an allow-list.
      - run: node scripts/third-party-licenses.mjs --check
      - run: bunx oxlint .
      - run: bunx prettier --check .

  # The atlas-journal CLI and its rules (crates/), on core's atlas-client crate.
  lint-rust:
    name: Lint (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          # rust-cache keys on every installed toolchain: keep only ours, as core's CI does.
          ours="$(rustup show active-toolchain | cut -d" " -f1)"
          rustup toolchain list | cut -d" " -f1 | grep -vxF "$ours" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

  # The rules against core's fake server and the CLI's golden runs (test-vectors/cli_golden.json);
  # the end-to-end tests need a server and run in `e2e`.
  test-rust:
    name: Test (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          ours="$(rustup show active-toolchain | cut -d" " -f1)"
          rustup toolchain list | cut -d" " -f1 | grep -vxF "$ours" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run --workspace --locked

  test-core:
    name: Test (journal-core)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The entry rules against the atlas-journal CLI's golden runs, the store and the sync engine.
      - working-directory: packages/journal-core
        run: bunx --bun vitest run

  test-app:
    name: Test (app)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jest-expo must run under real Node: under Bun's runtime the suites die at load.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - working-directory: apps/journal
        run: bun run test -- --ci --maxWorkers=4
      # The web build is the primary target: it must export.
      - name: Export the web app
        working-directory: apps/journal
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform web --output-dir "$RUNNER_TEMP/web"

  # The app's journal and the atlas-journal CLI (built here) against a real server: the server
  # image of the core release this app pins, with the web app served by that server and driven in
  # Chrome. The CLI's own end-to-end tests run first; then an entry either side writes must show up
  # on the other (crates/atlas-journal-cli/tests/e2e.rs, packages/journal-core/e2e,
  # scripts/e2e-web.mjs; locally `e2e:cli`).
  e2e:
    name: End to end (server + CLI)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 2s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The core release whose packages and server this app is built against: the exact
      # @atlastodo/client-core version the manifests pin (moved by scripts/update-deps.sh).
      - name: Read the core pin
        run: |
          core="$(git grep -hoE '"@atlastodo/client-core": "[0-9][^"]*"' -- '*package.json' | awk -F'"' 'NR == 1 { print $4 }')"
          echo "CORE_VERSION=$core" >>"$GITHUB_ENV"
          echo "ATLAS_SERVER_IMAGE=ghcr.io/atlastodo/atlas:$core" >>"$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          ours="$(rustup show active-toolchain | cut -d" " -f1)"
          rustup toolchain list | cut -d" " -f1 | grep -vxF "$ours" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.143
      - name: Build the atlas-journal CLI
        run: |
          cargo build --locked -p atlas-journal-cli
          echo "ATLAS_CLI=$GITHUB_WORKSPACE/target/debug/atlas-journal" >>"$GITHUB_ENV"
      - name: Export the web app
        working-directory: apps/journal
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform web --output-dir "$RUNNER_TEMP/web"
      - name: Start the server (ATLAS_APPS=todo,journal, serving the web app)
        run: |
          docker run -d --name atlas --network host \
            -e DATABASE_URL=postgres://atlas:atlas@127.0.0.1:5432/atlas \
            -e JWT_SECRET="$(head -c 48 /dev/urandom | base64)" -e PORT=8080 \
            -e ATLAS_APPS=todo,journal -e ATTACHMENTS_ENABLED=false \
            -e AUTH_RATE_LIMIT_MAX=100000 -e SYNC_RATE_LIMIT_MAX=100000 \
            -e SYNC_READ_RATE_LIMIT_MAX=100000 \
            -e STATIC_DIR=/srv/web -v "$RUNNER_TEMP/web:/srv/web:ro" \
            "$ATLAS_SERVER_IMAGE"
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/discovery
      - name: The CLI's end-to-end tests
        env:
          ATLAS_E2E_SERVER: http://127.0.0.1:8080
        run: cargo nextest run --locked -p atlas-journal-cli --test e2e --run-ignored all
      - name: The journal and the CLI
        working-directory: packages/journal-core
        env:
          ATLAS_E2E_URL: http://127.0.0.1:8080
        run: bunx --bun vitest run --config vitest.e2e.config.ts
      - name: The web app in Chrome
        env:
          BASE_URL: http://127.0.0.1:8080
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: CHROMIUM="$(command -v google-chrome || command -v chromium)" node scripts/e2e-web.mjs
      - if: always()
        run: docker logs atlas 2>&1 | tail -100
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # cargo-deny over the CLI's crates (deny.toml): advisories, licences, bans and sources.
  audit-rust:
    name: Audit (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check

  # The audit surfaces advisories without blocking: they often sit in un-updatable transitive
  # deps. Fixable ones go in `overrides` or a dependency bump, never an ignore list.
  audit:
    name: Audit (JS)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun audit
