[test]
# Tests run under vitest (packages/journal-core) and jest-expo (apps/journal), never `bun test`.
pathIgnorePatterns = ["**"]

[install]
# Our own core packages skip the release-age check scripts/update-deps.sh applies (`deps:update`).
minimumReleaseAgeExcludes = ["@atlastodo/client-core", "@atlastodo/shared"]
